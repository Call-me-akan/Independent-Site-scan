[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "store-monitor-agent"
version = "0.1.0"
description = "Local independent store product monitor with Feishu webhook notifications."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2"]

[project.scripts]
monitor = "monitor.cli:main"

[tool.setuptools]
packages = ["monitor", "monitor.adapters", "monitor.notifiers"]

