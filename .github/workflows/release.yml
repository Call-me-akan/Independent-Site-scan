name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: monitor-linux
            binary_path: dist/monitor
            launch_script: ""
            zip_name: monitor-linux
          - os: macos-latest
            binary_name: monitor-macos
            binary_path: dist/monitor
            launch_script: scripts/start-monitor.command
            zip_name: monitor-macos
          - os: windows-latest
            binary_name: monitor-windows.exe
            binary_path: dist/monitor.exe
            launch_script: scripts/start-monitor.bat
            zip_name: monitor-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Run tests
        run: pytest -q
      - name: Build executable
        run: pyinstaller --onefile --name monitor monitor/__main__.py
      - name: Assemble release folder
        shell: bash
        run: |
          mkdir -p release
          cp "${{ matrix.binary_path }}" "release/${{ matrix.binary_name }}"
          if [ -n "${{ matrix.launch_script }}" ] && [ -f "${{ matrix.launch_script }}" ]; then
            cp "${{ matrix.launch_script }}" "release/"
            echo "已附带启动脚本: ${{ matrix.launch_script }}"
          fi
          cp README.md release/README.md 2>/dev/null || true
          ls -la release/
      - name: Create zip
        shell: bash
        run: |
          python3 scripts/makezip.py "${{ matrix.zip_name }}.zip" release
          ls -la "${{ matrix.zip_name }}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}.zip
          path: ${{ matrix.zip_name }}.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: ls -la release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*