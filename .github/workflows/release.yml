name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: monitor-linux
            binary_path: dist/monitor
          - os: macos-latest
            artifact_name: monitor-macos
            binary_path: dist/monitor
          - os: windows-latest
            artifact_name: monitor-windows.exe
            binary_path: dist/monitor.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Run tests
        run: pytest -q
      - name: Build executable
        run: pyinstaller --onefile --name monitor monitor/__main__.py
      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p release
          cp "${{ matrix.binary_path }}" "release/${{ matrix.artifact_name }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.artifact_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
